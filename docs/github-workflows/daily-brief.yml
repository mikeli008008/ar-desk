name: AR-Desk Daily Brief

on:
  schedule:
    # 13:20 UTC = 09:20 EDT (夏令时) / 14:20 UTC = 09:20 EST (冬令时)
    # 两个都挂上，脚本内部用美东时间自己判断是否该跑
    - cron: '20 13 * * 1-5'
    - cron: '20 14 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略时间窗口强制运行'
        type: boolean
        default: true

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py ${{ (github.event_name == 'workflow_dispatch' && '--force') || '' }}
      - name: Commit brief + journal
        run: |
          git config user.name  "ar-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out data || true
          git diff --staged --quiet || git commit -m "brief $(date -u +%F)"
          git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: brief
          path: out/
          if-no-files-found: ignore
